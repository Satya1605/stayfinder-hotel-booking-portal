# The database "hotel_portal" is created automatically if MySQL is running.
# The password is read from the DB_PASSWORD environment variable (never commit it).
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Tables and sample data come from schema.sql and data.sql in this folder (safe to run on every start)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.port=8080
